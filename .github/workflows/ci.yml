name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, build, Worker types, engine and runtime regressions
        run: npm run check
      - name: Twinwire resume, takeover, private hands and durable restart
        run: npm run test:twinwire
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop, Android-sized and iPhone-sized browser regressions
        run: npm run test:browser
      - name: Optional browser storage remains optional during recovery
        run: BLOCK_SESSION_STORAGE=1 npx playwright test --grep 'two players'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

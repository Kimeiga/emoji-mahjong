name: UX source snapshot
on:
  push:
    branches: [feat/connections-first-v64]
    paths: [.github/workflows/ux-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --prefix=emoji-mahjong/ HEAD > /tmp/emoji-ux-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: emoji-ux-source
          path: /tmp/emoji-ux-source.tar.gz
          retention-days: 3

name: Apply JS Weekly React and Vite update

on:
  push:
    branches:
      - chore/js-weekly-react-vite

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update React and Vite
        run: |
          npm install 'react@^19.3.0' 'react-dom@^19.3.0'
          npm install --save-dev 'vite@^8.3.0' '@types/react@latest' '@types/react-dom@latest'
      - name: Validate
        run: npm run check
      - name: Browser tests
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:browser
      - name: Commit generated dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/js-weekly-upgrade.yml
          git add package.json package-lock.json
          git commit -m "chore: update React and Vite"
          git push origin HEAD:chore/js-weekly-react-vite

name: Release evidence

on:
  push:
    branches: [fix/release-recovery-v63]

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fe1dd25b9298e5af7b3c095f2fa71f58ba250ce8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package offline tools
        run: tar -czf /tmp/emoji-node-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: emoji-node-deps
          path: /tmp/emoji-node-deps.tar.gz
          retention-days: 1
